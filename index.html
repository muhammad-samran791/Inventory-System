<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "yu3sfcxsy2");
    </script>
    <title>Inventory System</title>
  </head>

  <body>
    <div class="container">
      <h1 class="text-center my-4">Inventory System</h1>

      <div class="row">
        <div class="col-lg-6 col-md-12 col-12">
          <div class="inventory-section p-3 border rounded bg-light">
            <h2>Inventory</h2>
            <div class="add-item d-flex flex-column gap-2">
              <h3>Add New Item</h3>
              <input
                type="text"
                class="form-control"
                id="add-product-name"
                placeholder="Product Name"
              />
              <input
                type="number"
                class="form-control"
                id="add-product-price"
                placeholder="Price"
              />
              <input
                type="number"
                class="form-control"
                id="add-product-quantity"
                placeholder="Quantity"
              />
              <button class="btn btn-success" id="add-item-btn">
                Add Item
              </button>
            </div>
            <table class="table table-striped mt-3">
              <thead>
                <tr>
                  <th class="text-center">Product Name</th>
                  <th class="text-center">Price</th>
                  <th class="text-center">Quantity</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="inventory-list"></tbody>
            </table>
          </div>
        </div>

        <div class="col-lg-6 col-md-12 col-12">
          <div class="sales-section p-3 border rounded bg-light">
            <h2>Sales</h2>
            <div class="new-sale d-flex flex-column gap-2">
              <h3>New Sale</h3>
              <select class="form-control" id="sale-product-select">
                <option value="">Select Product</option>
              </select>
              <input
                type="number"
                class="form-control"
                id="sale-quantity"
                placeholder="Quantity"
              />
              <button class="btn btn-primary" id="add-to-sale-btn">
                Add to Sale
              </button>
            </div>
            <table class="table table-striped mt-3">
              <thead>
                <tr>
                  <th class="text-center">Product Name</th>
                  <th class="text-center">Quantity</th>
                  <th class="text-center">Price</th>
                  <th class="text-center">Total</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="sale-items-list"></tbody>
            </table>
            <div
              class="total text-end d-flex justify-content-center align-items-center gap-3"
            >
              <strong>Total: <span id="sale-total">0.00</span></strong>
              <button class="btn btn-danger" id="complete-sale-btn">
                Complete Sale
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="sales-history-section p-3 border rounded bg-light mt-4">
        <h2>Sales History</h2>
        <table class="table table-striped">
          <thead>
            <tr>
              <th class="text-center">Sale ID</th>
              <th class="text-center">Items</th>
              <th class="text-center">Total Amount</th>
              <th class="text-center">Date</th>
            </tr>
          </thead>
          <tbody id="sales-history-list"></tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
